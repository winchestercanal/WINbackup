<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação</title>

<style>
body{margin:0}
a:focus-visible{outline:2px solid #19e3ff;outline-offset:2px}
</style>
</helmet>
<nav aria-label="Seções" style="width: 248px; height: 758px; box-sizing: border-box; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; background: #070b15; border-right: 1px solid #141f38; color: #e8f0ff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
<a href="Main.dc.html" class="nav-i" aria-current="{{home.current}}" style="height: 38px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 6px; background: {{home.bg}}; color: {{home.fg}}; font-size: 14px; font-weight: {{home.weight}}; text-decoration: none; position: relative">

<span>Início</span>
</a>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<button onClick="{{g.toggle}}" class="nav-g" aria-expanded="{{g.open}}" style="height: 38px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: {{g.fg}}; font-family: inherit; font-size: 14px; font-weight: {{g.weight}}; text-align: left; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.d}}"></path></svg>
<span style="flex-grow: 1">{{g.label}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8ea3c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{g.rot}}); transition: transform 0.15s"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 2px; margin: 0 0 4px 21px; padding-left: 8px; border-left: 1px solid #1a2847">
<sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
<a href="{{item.href}}" class="nav-i" aria-current="{{item.current}}" style="height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; background: {{item.bg}}; color: {{item.fg}}; font-size: 13.5px; font-weight: {{item.weight}}; text-decoration: none; position: relative">

</sc-for>
</div>
</sc-if>
</sc-for>
<div style="flex-grow: 1"></div>
<sc-if value="{{pickerOpen}}" hint-placeholder-val="{{false}}">

<span style="font-size: 12.5px; font-weight: 600">{{d.label}}</span>
<span style="font-size: 11px; color: #8ea3c7; font-family: 'Cascadia Mono', Consolas, monospace">{{d.path}}</span>
</span>

</sc-for>
<button onClick="{{closePicker}}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-top: 1px solid #1a2847; border-radius: 0 0 7px 7px; background: transparent; color: #9fc3ff; font-family: inherit; font-size: 12.5px; font-weight: 600; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM12 11v5M9.5 13.5h5"></path></svg>

</div>
</sc-if>
<button onClick="{{togglePicker}}" aria-expanded="{{pickerOpen}}" aria-label="Destino dos backups: {{cur.path}}. Clique para alterar" style="display: flex; flex-direction: column; gap: 7px; padding: 12px; border-radius: 10px; background: #0c1426; border: 1px solid {{cardBorder}}; color: #e8f0ff; font-family: inherit; text-align: left; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #7f93b8">DESTINO DOS BACKUPS</span>
<span style="font-size: 11.5px; font-weight: 600; color: #19e3ff">Alterar</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; width: 100%">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#19e3ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{cur.icon}}"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 13px; font-weight: 600">{{cur.label}}</span>
<span style="font-size: 11.5px; color: #a9badb; font-family: 'Cascadia Mono', Consolas, monospace">{{cur.path}}</span>
</span>
<span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #3ddc97"></span>
</span>
<span style="height: 6px; width: 100%; border-radius: 6px; background: #1a2847; overflow: hidden; display: block"><span style="display: block; width: {{cur.used}}; height: 6px; background: #2f7bff"></span></span>
<span style="font-size: 11.5px; color: #8ea3c7">[LIVRE] livres de [TOTAL]</span>
</button>
<a href="Options.dc.html" class="nav-i" aria-current="{{optCurrent}}" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-top: 6px; border-radius: 6px; background: {{optBg}}; color: {{optFg}}; font-size: 14px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
Opções
</a>
<a href="https://www.youtube.com/WINchesterCanal" class="yt" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 6px; color: #ff5c6c; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 5h11A4 4 0 0 1 21.5 9v6a4 4 0 0 1-4 4h-11a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4zM10 9l5 3-5 3z"></path></svg>
Tutorial no YouTube
</a>
</nav>
</x-dc>
